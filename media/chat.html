<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <!-- CSP：只放行本站样式 + 带 nonce 的脚本，禁一切远程资源。占位符由扩展侧替换。
       放宽说明（仅 DSH 真组件画面需要）：style-src 加 'unsafe-inline'（CSS-module/主题注入
       <style> 与 React 行内 style），font/img 加 data:（本地字体/图）。脚本仍必须带 nonce。 -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; style-src %%CSP_SOURCE%% 'unsafe-inline'; script-src 'nonce-%%NONCE%%'; font-src %%CSP_SOURCE%% data:; img-src %%CSP_SOURCE%% data:;">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- DSH 主题令牌（media/dsh-live 产物齐全时展开为 <link>，缺失时被置空 → 回退 VS Code 观感）。
       必须排在 chat.css 之前：chat.css 的双兜底变量与 body 默认需要盖在令牌表之上。 -->
  %%DSH_THEME_LINK%%
  <link rel="stylesheet" href="%%CSS_URI%%">
  <title>Hello Chat</title>
</head>
<body>
  <!-- 行1（恒显示）：顶部 tab 条 —— 左侧内嵌聊天/Harness（模式胶囊），右侧仅 harness 可见的
       模拟/DSH直播胶囊 + 连接状态。一条里装下「模式 + 后端」两段选择（tabs 合并为一行）。 -->
  <div id="top-row" class="top-row">
    <div id="mode-bar" class="mode-bar" role="tablist" aria-label="工作模式">
      <button type="button" id="mode-chat" class="mode-tab active" data-mode="chat"
              role="tab" aria-selected="true">内嵌聊天</button>
      <button type="button" id="mode-harness" class="mode-tab" data-mode="harness"
              role="tab" aria-selected="false">Harness</button>
    </div>

    <!-- Harness 后端开关：模拟（内置演示流）/ DSH 直播（本地 DeepSeek Harness 子进程）。
         只有 harness 模式可见（JS applyMode 里切 backend-bar.hidden）。扩展侧记住选择、
         以 backend-status 回传真相。 -->
    <div id="backend-bar" class="backend-bar" hidden>
      <div class="backend-tabs" role="tablist" aria-label="Harness 回复后端">
        <button type="button" id="backend-mock" class="backend-tab active" data-backend="mock"
                role="tab" aria-selected="true" title="内置演示工具流，不调用外部服务">模拟</button>
        <button type="button" id="backend-live" class="backend-tab" data-backend="live"
                role="tab" aria-selected="false" title="连接本地 DeepSeek Harness（DSH）子进程">DSH 直播</button>
      </div>
      <span id="backend-status" class="backend-status offline"></span>
    </div>
  </div>

  <!-- 行2（恒显示）：会话控制条 —— 可点改标题 + 历史/新建。历史面板 absolute 以此 header 为锚。 -->
  <header class="chat-header">
    <div class="chat-title-wrap">
      <!-- 顶栏标题：点击进入编辑；没命名时显示"新对话"占位 -->
      <span id="chat-title" class="chat-title untitled" title="点击给会话命名">新对话</span>
      <input id="chat-title-input" class="chat-title-input" type="text" maxlength="60"
             placeholder="输入标题，留空恢复为第一条消息" hidden>
    </div>
    <div class="header-actions">
      <button id="history-btn" class="link-button" title="历史会话">历史</button>
      <button id="new-chat-btn" class="link-button" title="开始新对话">新建对话</button>
    </div>
    <!-- 必须挂在 header 内：absolute 的定位基准是最近的 position:relative 祖先 -->
    <div id="history-panel" class="history-panel">
      <input id="history-search" class="history-search" type="text"
             placeholder="搜索历史标题…" spellcheck="false">
      <div class="history-scroll">
        <div class="history-empty" id="history-empty">暂无历史会话</div>
        <ul id="history-list" class="history-list"></ul>
      </div>
    </div>
  </header>

  <main id="messages" class="messages">
    <!-- 空态文案按当前模式由 JS 覆盖（见 toggleEmptyHint） -->
    <div id="empty-hint" class="empty-hint"></div>
  </main>

  <!-- 真 DSH 对话组件的挂载节点（仅 harness + DSH 直播时揭示）。占位符由扩展侧替换：
       data-js/data-css = media/dsh-live 产物的 webview uri；data-nonce = 本次文档的脚本 nonce。
       懒加载桥在 chat.js：首次 reactLive 才注入 link/script（见 syncReactLive）。 -->
  <div id="dsh-live-host" class="dsh-live-host" hidden
       data-js="%%DSH_LIVE_JS_URI%%" data-css="%%DSH_LIVE_CSS_URI%%"
       data-nonce="%%NONCE%%"></div>

  <footer class="composer">
    <!-- 待发送的文件附件 chip 条（发送前可逐个移除） -->
    <div id="attach-bar" class="attach-bar" hidden>
      <div id="attach-list" class="attach-list"></div>
    </div>
    <textarea id="input" class="input" rows="3"
              placeholder="输入消息，Enter 发送，Shift+Enter 换行；Ctrl+V 粘贴或拖入文件可加附件…"></textarea>
    <div class="composer-actions">
      <button id="attach-btn" class="button button-secondary" title="添加文件附件">＋附件</button>
      <button id="stop-btn" class="button button-secondary" hidden>停止</button>
      <button id="send-btn" class="button button-primary">发送</button>
    </div>
    <!-- 仅 DSH 直播后端可见的底部配置条：模型下拉(+自定义) + API Key 状态/配置（Claude Code 式） -->
    <div id="live-config-bar" class="live-config-bar" hidden>
      <label class="lc-field" for="live-model-sel">
        <span class="lc-label">模型</span>
        <select id="live-model-sel" class="lc-select" title="切换模型（需停在运行中后生效，会重启 live 子进程）"></select>
      </label>
      <input id="live-model-input" class="lc-input" type="text" spellcheck="false" maxlength="120"
             hidden placeholder="输入模型 id，回车应用">
      <button id="live-api-btn" class="link-button lc-api" type="button"
              title="配置 DEEPSEEK_API_KEY（保存到 VS Code SecretStorage，回退读取 ~/.dsh/.credentials.yaml）">API</button>
    </div>
  </footer>

  <script nonce="%%NONCE%%" src="%%JS_URI%%"></script>
</body>
</html>
