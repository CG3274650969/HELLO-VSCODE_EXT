<!-- AlohaDSH 横幅标记（浅色背景版）—— README 头部用，**不上活动栏、不当图标**。

     与 media/icon.svg 同一个造型，两处差别，都是有意的：
     ① 这里**写死了 fill**：icon.svg 是给 VS Code 当遮罩用的（无 fill，用主题色渲染），
        而经 <img>/<picture> 载入的 SVG 没有遮罩那回事 —— 不写 fill 就按 SVG 默认的黑色画，
        暗色主题下等于看不见。所以这里必须显式给色。
     ② 颜色取 GitHub 自己的前景色 token（浅 #1f2328 / 深 #e6edf3，见 logo-dark.svg），
        两种主题下都跟正文一个色，不像一张白底方图那样在暗色主题里突兀。

     **path 数据必须与 icon.svg 逐字一致** —— 两边各改各的就会出现两只不一样的鲸鱼。
     换造型请先改 icon.svg，再原样搬过来（viewBox 与 path 一起搬）。

     用法（两边同款）：
       <picture>
         <source media="(prefers-color-scheme: dark)" srcset="media/logo-dark.svg">
         <img src="media/logo-light.svg" alt="AlohaDSH" width="220">
       </picture>
     <picture> 而不是给 SVG 内部塞 @media：媒体查询在「图片模式」的 SVG 里各浏览器支持不齐，
     <picture> 是 GitHub 自己文档里给暗/亮两版的写法。 -->
